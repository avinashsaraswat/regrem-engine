<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 722" width="100%" role="img" aria-labelledby="t1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t1">One finding, end to end, and where RegRem Engine works: six steps from the Supervisor's letter to closure, with what happens, who leads and what the tool does at each step.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/></marker></defs><rect x="0" y="0" width="1000" height="722" rx="12" fill="#ffffff"/>
<text x="20.0" y="36.0" font-size="18" font-weight="600" fill="#1f1e1d" text-anchor="start">One finding, end to end, and where RegRem Engine works</text>
<rect x="138.0" y="58" width="133.7" height="64.2" rx="6" fill="#1f1e1d"/>
<text x="146.0" y="85.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">1 Finding issued</text>
<path d="M272.7 90.1 L277.7 90.1" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="279.7" y="58" width="133.7" height="64.2" rx="6" fill="#1f1e1d"/>
<text x="287.7" y="85.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">2 Plan approved</text>
<path d="M414.3 90.1 L419.3 90.1" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="421.3" y="58" width="133.7" height="64.2" rx="6" fill="#1f1e1d"/>
<text x="429.3" y="85.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">3 Work and</text>
<text x="429.3" y="103.2" font-size="14" font-weight="600" fill="#fff" text-anchor="start">evidence</text>
<path d="M556.0 90.1 L561.0 90.1" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="563.0" y="58" width="133.7" height="64.2" rx="6" fill="#1f1e1d"/>
<text x="571.0" y="85.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">4 Memo checked</text>
<path d="M697.7 90.1 L702.7 90.1" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="704.7" y="58" width="133.7" height="64.2" rx="6" fill="#1f1e1d"/>
<text x="712.7" y="85.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">5 Audit tests</text>
<path d="M839.3 90.1 L844.3 90.1" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="846.3" y="58" width="133.7" height="64.2" rx="6" fill="#1f1e1d"/>
<text x="854.3" y="85.0" font-size="14" font-weight="600" fill="#fff" text-anchor="start">6 Supervisor</text>
<text x="854.3" y="103.2" font-size="14" font-weight="600" fill="#fff" text-anchor="start">closes</text>
<rect x="20" y="132.2" width="110" height="157.2" rx="6" fill="#f1f3f5"/>
<text x="28.0" y="157.2" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="start">What happens</text>
<rect x="138.0" y="132.2" width="133.7" height="157.2" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="146.0" y="156.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The Supervisor&#x27;s</text>
<text x="146.0" y="173.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">letter names a</text>
<text x="146.0" y="190.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">problem, its cause</text>
<text x="146.0" y="206.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">and the fix it wants</text>
<text x="146.0" y="223.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">by a date.</text>
<rect x="279.7" y="132.2" width="133.7" height="157.2" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="287.7" y="156.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The financial</text>
<text x="287.7" y="173.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">institution answers</text>
<text x="287.7" y="190.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">in writing, with one</text>
<text x="287.7" y="206.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">owner and one</text>
<text x="287.7" y="223.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">date for each</text>
<text x="287.7" y="240.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">milestone. The</text>
<text x="287.7" y="257.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">board approves</text>
<text x="287.7" y="274.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">the plan.</text>
<rect x="421.3" y="132.2" width="133.7" height="157.2" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="429.3" y="156.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The institution</text>
<text x="429.3" y="173.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">changes</text>
<text x="429.3" y="190.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">procedures,</text>
<text x="429.3" y="206.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">controls and</text>
<text x="429.3" y="223.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">systems, and files</text>
<text x="429.3" y="240.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">signed evidence.</text>
<text x="429.3" y="257.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The board hears</text>
<text x="429.3" y="274.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">progress.</text>
<rect x="563.0" y="132.2" width="133.7" height="157.2" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="571.0" y="156.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The closure memo</text>
<text x="571.0" y="173.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">says what was</text>
<text x="571.0" y="190.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">done and how it</text>
<text x="571.0" y="206.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">was tested. The</text>
<text x="571.0" y="223.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">board approves</text>
<text x="571.0" y="240.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">closure and the</text>
<text x="571.0" y="257.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">owner signs.</text>
<rect x="704.7" y="132.2" width="133.7" height="157.2" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="712.7" y="156.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Internal audit tests</text>
<text x="712.7" y="173.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">whether the fix</text>
<text x="712.7" y="190.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">works, and</text>
<text x="712.7" y="206.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">reports.</text>
<rect x="846.3" y="132.2" width="133.7" height="157.2" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="854.3" y="156.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The Supervisor</text>
<text x="854.3" y="173.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">closes the finding</text>
<text x="854.3" y="190.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">or sends it back.</text>
<rect x="20" y="299.4" width="110" height="55.8" rx="6" fill="#f1f3f5"/>
<text x="28.0" y="324.4" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="start">Who</text>
<rect x="138.0" y="299.4" width="133.7" height="55.8" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="146.0" y="323.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The Supervisor</text>
<rect x="279.7" y="299.4" width="133.7" height="55.8" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="287.7" y="323.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The finding owner,</text>
<text x="287.7" y="340.3" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">then the board</text>
<rect x="421.3" y="299.4" width="133.7" height="55.8" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="429.3" y="323.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The business</text>
<text x="429.3" y="340.3" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">teams</text>
<rect x="563.0" y="299.4" width="133.7" height="55.8" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="571.0" y="323.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The finding owner</text>
<text x="571.0" y="340.3" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">and the board</text>
<rect x="704.7" y="299.4" width="133.7" height="55.8" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="712.7" y="323.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Internal audit</text>
<rect x="846.3" y="299.4" width="133.7" height="55.8" rx="6" fill="#ffffff" stroke="#c9cdd3"/>
<text x="854.3" y="323.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">The Supervisor</text>
<rect x="20" y="365.2" width="110" height="246.7" rx="6" fill="#fdf0e8"/>
<text x="28.0" y="390.2" font-size="13" font-weight="600" fill="#9a3412" text-anchor="start">Where</text>
<text x="28.0" y="407.1" font-size="13" font-weight="600" fill="#9a3412" text-anchor="start">RegRem</text>
<text x="28.0" y="424.0" font-size="13" font-weight="600" fill="#9a3412" text-anchor="start">Engine works</text>
<rect x="138.0" y="365.2" width="133.7" height="246.7" rx="6" fill="#fdf0e8" stroke="#9a3412"/>
<text x="146.0" y="389.2" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding new</text>
<text x="146.0" y="411.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Makes one folder</text>
<text x="146.0" y="428.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">for the finding,</text>
<text x="146.0" y="444.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">with its templates.</text>
<text x="146.0" y="461.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">A person pastes in</text>
<text x="146.0" y="478.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">the letter, and the</text>
<text x="146.0" y="495.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">first check locks</text>
<text x="146.0" y="512.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">its wording.</text>
<rect x="279.7" y="365.2" width="133.7" height="246.7" rx="6" fill="#fdf0e8" stroke="#9a3412"/>
<text x="287.7" y="389.2" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding check</text>
<text x="287.7" y="411.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Turns the plan into</text>
<text x="287.7" y="428.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">the institution&#x27;s</text>
<text x="287.7" y="444.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">written answer.</text>
<text x="287.7" y="461.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Dates stay</text>
<text x="287.7" y="478.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">&quot;proposed&quot; until</text>
<text x="287.7" y="495.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">the board&#x27;s</text>
<text x="287.7" y="512.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">approval is filed,</text>
<text x="287.7" y="529.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">and a later move</text>
<text x="287.7" y="546.3" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">shows.</text>
<rect x="421.3" y="365.2" width="133.7" height="246.7" rx="6" fill="#fdf0e8" stroke="#9a3412"/>
<text x="429.3" y="389.2" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding covers</text>
<text x="429.3" y="406.1" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding check</text>
<text x="429.3" y="428.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Drafts each</text>
<text x="429.3" y="444.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">evidence cover for</text>
<text x="429.3" y="461.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">a person to sign.</text>
<text x="429.3" y="478.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Shows which</text>
<text x="429.3" y="495.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">milestones are</text>
<text x="429.3" y="512.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">signed or late, and</text>
<text x="429.3" y="529.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">drafts the board</text>
<text x="429.3" y="546.3" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">summary.</text>
<rect x="563.0" y="365.2" width="133.7" height="246.7" rx="6" fill="#fdf0e8" stroke="#9a3412"/>
<text x="571.0" y="389.2" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding check</text>
<text x="571.0" y="406.1" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding sign</text>
<text x="571.0" y="428.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Ties each figure,</text>
<text x="571.0" y="444.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">date and quotation</text>
<text x="571.0" y="461.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">in the memo to the</text>
<text x="571.0" y="478.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">page it cites. What</text>
<text x="571.0" y="495.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">does not match</text>
<text x="571.0" y="512.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">goes on one list</text>
<text x="571.0" y="529.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">for the owner.</text>
<text x="571.0" y="546.3" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Signing records a</text>
<text x="571.0" y="563.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">fingerprint, so a</text>
<text x="571.0" y="580.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">later edit needs a</text>
<text x="571.0" y="597.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">fresh signature.</text>
<rect x="704.7" y="365.2" width="133.7" height="246.7" rx="6" fill="#fdf0e8" stroke="#9a3412"/>
<text x="712.7" y="389.2" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding eval</text>
<text x="712.7" y="406.1" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding check</text>
<text x="712.7" y="428.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Plants test errors</text>
<text x="712.7" y="444.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">in a copy of the</text>
<text x="712.7" y="461.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">memo and lists</text>
<text x="712.7" y="478.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">what the check</text>
<text x="712.7" y="495.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">missed. If the</text>
<text x="712.7" y="512.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">folder changes</text>
<text x="712.7" y="529.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">after audit&#x27;s test,</text>
<text x="712.7" y="546.3" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">the check asks for</text>
<text x="712.7" y="563.2" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">a fresh one.</text>
<rect x="846.3" y="365.2" width="133.7" height="246.7" rx="6" fill="#fdf0e8" stroke="#9a3412"/>
<text x="854.3" y="389.2" font-size="13" font-weight="700" fill="#9a3412" text-anchor="start">finding check</text>
<text x="854.3" y="411.1" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Names the</text>
<text x="854.3" y="428.0" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">Supervisor&#x27;s</text>
<text x="854.3" y="444.9" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">closure notice as</text>
<text x="854.3" y="461.8" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">still needed. Until</text>
<text x="854.3" y="478.7" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">it is recorded, a</text>
<text x="854.3" y="495.6" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">line calling the</text>
<text x="854.3" y="512.5" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">finding closed</text>
<text x="854.3" y="529.4" font-size="13" font-weight="normal" fill="#1f1e1d" text-anchor="start">stays on the list.</text>
<text x="20.0" y="641.9" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Shaded: where RegRem Engine works. The check ties each figure, date and quotation</text><text x="20.0" y="657.4" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">to the evidence page it cites. It has no AI model inside and does not judge whether</text><text x="20.0" y="672.9" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">a fix is right. People rule on the list, sign, test the fix and close the finding.</text><text x="20.0" y="688.4" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">The tool sends nothing anywhere, the folder belongs on a machine the institution approves,</text><text x="20.0" y="703.9" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">and every case in this repository is invented.</text></svg>
