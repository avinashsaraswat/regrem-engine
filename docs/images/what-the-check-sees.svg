<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 738" width="100%" role="img" aria-labelledby="wcs-title"><title id="wcs-title">What the check catches, and what a person still reads for. Three lines of a closure memo point to the evidence pages they cite. A quotation and a date match their pages. The figure 1,248 does not match its page, which says 1,284, so it goes on the list for the finding owner. Beside them, five things a person still reads for and one known limit of the check.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1000" height="738" rx="12" fill="#ffffff"/>
<text x="20" y="34" font-size="18" font-weight="600" fill="#1f1e1d">What the check catches, and what a person still reads for</text>
<text x="20" y="57" font-size="13" fill="#5b6470">RegRem Engine looks for each figure, date and quotation in a closure memo on the evidence page it cites.</text>

<!-- Left panel: what the check catches -->
<rect x="20" y="76" width="627" height="552" rx="10" fill="#fafafa" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="34" y="98" font-size="13.5" font-weight="700" fill="#9a3412">What the check catches</text>

<!-- Closure memo card -->
<rect x="34" y="112" width="276" height="367" rx="10" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="46" y="131" font-size="13" font-weight="700" fill="#5b6470">Closure memo</text>

<rect x="44" y="141" width="256" height="104" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="52" y="161" font-size="12.5" font-weight="700" fill="#5b6470">Line 6</text>
<rect x="220" y="148" width="74" height="18" rx="9" fill="#f1f3f5"/>
<text x="257" y="161" font-size="12" fill="#5b6470" text-anchor="middle">Quotation</text>
<text x="52" y="182" font-size="13" fill="#1f1e1d">A complaint that mentions a fee and</text>
<text x="52" y="199" font-size="13" fill="#1f1e1d">a service failure is <tspan font-weight="700">"classified as</tspan></text>
<text x="52" y="216" font-size="13" fill="#1f1e1d"><tspan font-weight="700">a fee dispute first"</tspan> [EV-03 p1].</text>

<rect x="44" y="253" width="256" height="104" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="52" y="273" font-size="12.5" font-weight="700" fill="#5b6470">Line 8</text>
<rect x="250" y="260" width="44" height="18" rx="9" fill="#f1f3f5"/>
<text x="272" y="273" font-size="12" fill="#5b6470" text-anchor="middle">Date</text>
<text x="52" y="294" font-size="13" fill="#1f1e1d">The Head of Complaints signed the</text>
<text x="52" y="311" font-size="13" fill="#1f1e1d">procedure on <tspan font-weight="700">2026-03-14</tspan></text>
<text x="52" y="328" font-size="13" fill="#1f1e1d">[EV-07 p1].</text>

<rect x="44" y="365" width="256" height="104" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="52" y="385" font-size="12.5" font-weight="700" fill="#5b6470">Line 8</text>
<rect x="240" y="372" width="54" height="18" rx="9" fill="#f1f3f5"/>
<text x="267" y="385" font-size="12" fill="#5b6470" text-anchor="middle">Figure</text>
<text x="52" y="406" font-size="13" fill="#1f1e1d">...the team reclassified <tspan font-weight="700" fill="#9a3412">1,248</tspan></text>
<text x="52" y="423" font-size="13" fill="#1f1e1d">complaints that the earlier</text>
<text x="52" y="440" font-size="13" fill="#1f1e1d">procedure had logged as service</text>
<text x="52" y="457" font-size="13" fill="#1f1e1d">issues [EV-07 p2].</text>

<!-- The check band -->
<rect x="314" y="112" width="70" height="367" rx="8" fill="#fdf0e8" stroke="#9a3412" stroke-width="1.5"/>
<text x="349" y="131" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">The check</text>

<!-- Evidence pages panel -->
<rect x="388" y="112" width="247" height="367" rx="10" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="400" y="131" font-size="13" font-weight="700" fill="#5b6470">Evidence pages it cites</text>

<rect x="398" y="141" width="227" height="104" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="406" y="161" font-size="13.5" font-weight="700" fill="#1f1e1d">EV-03, page 1</text>
<text x="406" y="178" font-size="12.5" fill="#5b6470">Complaint taxonomy</text>
<text x="406" y="199" font-size="13" fill="#1f1e1d">...a fee and a service failure is</text>
<text x="406" y="216" font-size="13" fill="#1f1e1d"><tspan font-weight="700">classified as a fee dispute first</tspan>.</text>

<rect x="398" y="253" width="227" height="104" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="406" y="273" font-size="13.5" font-weight="700" fill="#1f1e1d">EV-07, page 1</text>
<text x="406" y="290" font-size="12.5" fill="#5b6470">Complaint intake procedure</text>
<text x="406" y="311" font-size="13" fill="#1f1e1d">Owner: Head of Complaints.</text>
<text x="406" y="328" font-size="13" fill="#1f1e1d">Signed <tspan font-weight="700">2026-03-14</tspan>.</text>

<rect x="398" y="365" width="227" height="104" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="406" y="385" font-size="13.5" font-weight="700" fill="#1f1e1d">EV-07, page 2</text>
<text x="406" y="402" font-size="12.5" fill="#5b6470">Complaint intake procedure</text>
<text x="406" y="423" font-size="13" fill="#1f1e1d">Between January and March the</text>
<text x="406" y="440" font-size="13" fill="#1f1e1d">team reclassified <tspan font-weight="700" fill="#9a3412">1,284</tspan></text>
<text x="406" y="457" font-size="13" fill="#1f1e1d">complaints ...</text>

<!-- Arrows from each claim to its cited page, with the check's verdict -->
<path d="M302 197 L396 197" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M302 309 L396 309" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M302 421 L396 421" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>

<text x="349" y="176" font-size="12" font-weight="600" fill="#5b6470" text-anchor="middle">matches</text>
<circle cx="349" cy="197" r="12" fill="#5b6470" stroke="#fdf0e8" stroke-width="3"/>
<path d="M343.5 197.5 L347.5 201.5 L354.5 193.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

<text x="349" y="288" font-size="12" font-weight="600" fill="#5b6470" text-anchor="middle">matches</text>
<circle cx="349" cy="309" r="12" fill="#5b6470" stroke="#fdf0e8" stroke-width="3"/>
<path d="M343.5 309.5 L347.5 313.5 L354.5 305.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

<text x="349" y="400" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">no match</text>
<circle cx="349" cy="421" r="12" fill="#9a3412" stroke="#fdf0e8" stroke-width="3"/>
<path d="M344.5 416.5 L353.5 425.5 M353.5 416.5 L344.5 425.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

<path d="M349 435 L349 511" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<text x="359" y="501" font-size="12" font-weight="600" fill="#9a3412">goes on the list</text>

<!-- The list -->
<rect x="34" y="514" width="601" height="100" rx="6" fill="#fdf0e8" stroke="#9a3412" stroke-width="2"/>
<text x="46" y="536" font-size="13.5" font-weight="700" fill="#1f1e1d">The list, for the finding owner</text>
<text x="46" y="557" font-size="13" fill="#1f1e1d"><tspan font-weight="700">Line 8:</tspan> the memo says <tspan font-weight="700" fill="#9a3412">1,248</tspan>, and page 2 of EV-07 says <tspan font-weight="700" fill="#9a3412">1,284</tspan>.</text>
<text x="46" y="574" font-size="13" fill="#1f1e1d">Two digits were swapped in typing. The owner rules on each row before anyone signs.</text>
<text x="46" y="591" font-size="13" fill="#1f1e1d">Here the owner rules "fix the memo", and someone corrects the figure.</text>

<!-- Right panel: what the check cannot judge -->
<rect x="659" y="76" width="321" height="552" rx="10" fill="#fafafa" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="671" y="98" font-size="13.5" font-weight="700" fill="#5b6470">What the check cannot judge</text>
<text x="671" y="118" font-size="12.5" fill="#5b6470">It reads each claim against its own cited page</text>
<text x="671" y="134" font-size="12.5" fill="#5b6470">only, so a person still reads for these.</text>

<rect x="669" y="145" width="301" height="54" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="685" cy="164" r="9.5" fill="#5b6470"/>
<text x="685" y="168.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="702" y="168" font-size="13" fill="#1f1e1d">A version in force that is later than</text>
<text x="702" y="185" font-size="13" fill="#1f1e1d">the one approved.</text>

<rect x="669" y="211" width="301" height="71" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="685" cy="230" r="9.5" fill="#5b6470"/>
<text x="685" y="234.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="702" y="234" font-size="13" fill="#1f1e1d">Figures that disagree between</text>
<text x="702" y="251" font-size="13" fill="#1f1e1d">documents. Each can match its own</text>
<text x="702" y="268" font-size="13" fill="#1f1e1d">page, so both pass.</text>

<rect x="669" y="294" width="301" height="54" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="685" cy="313" r="9.5" fill="#5b6470"/>
<text x="685" y="317.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="702" y="317" font-size="13" fill="#1f1e1d">A scanned page that differs from the</text>
<text x="702" y="334" font-size="13" fill="#1f1e1d">financial institution's other records.</text>

<rect x="669" y="360" width="301" height="71" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="685" cy="379" r="9.5" fill="#5b6470"/>
<text x="685" y="383.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="702" y="383" font-size="13" fill="#1f1e1d">Work dated before the control that</text>
<text x="702" y="400" font-size="13" fill="#1f1e1d">should come first, such as people</text>
<text x="702" y="417" font-size="13" fill="#1f1e1d">working before their training.</text>

<rect x="669" y="443" width="301" height="54" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="685" cy="462" r="9.5" fill="#5b6470"/>
<text x="685" y="466.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="702" y="466" font-size="13" fill="#1f1e1d">A status report that says more than</text>
<text x="702" y="483" font-size="13" fill="#1f1e1d">its evidence.</text>

<rect x="669" y="509" width="301" height="105" rx="6" fill="#ffffff" stroke="#9a3412" stroke-width="1" stroke-dasharray="4 3"/>
<text x="681" y="530" font-size="13.5" font-weight="700" fill="#9a3412">Known limit</text>
<text x="681" y="550" font-size="13" fill="#1f1e1d">A wrong figure that also sits on the</text>
<text x="681" y="567" font-size="13" fill="#1f1e1d">cited page still matches. If the memo</text>
<text x="681" y="584" font-size="13" fill="#1f1e1d">said 48 of 48 handlers trained where</text>
<text x="681" y="601" font-size="13" fill="#1f1e1d">the page says 46 of 48, it would pass.</text>

<!-- Closing lines and footnote -->
<text x="20" y="660" font-size="14" font-weight="600" fill="#1f1e1d">The check gives the same answer on every run, because there is no AI model inside it.</text>
<text x="20" y="681" font-size="14" font-weight="600" fill="#1f1e1d">Whether the fix works stays with people. Internal audit tests it, and only whoever raised the finding can close it.</text>
<text x="20" y="705" font-size="12.5" fill="#5b6470">The shaded parts are the check's work, and the dashed box is a known limit.</text>
<text x="20" y="721" font-size="12.5" fill="#5b6470">Lines and pages come from MRA-CMP-07, shortened where they show three dots. Every case in this repository is invented.</text>
</g></svg>
