<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 711" width="100%" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="title">The system: what runs where, and what the financial institution sends to the Supervisor</title><desc id="desc">One approved machine inside the institution holds the finding folder and RegRem Engine. Where the institution allows an AI assistant, it drafts into the folder. The institution&#x27;s own systems stay as they are. RegRem Engine sends nothing out, and the institution sends the closure package by its own channels.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/></marker></defs><rect x="0" y="0" width="1000" height="711" rx="12" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="18" font-weight="600" fill="#1f1e1d" text-anchor="start">The system: what runs where, and what the financial institution sends to the Supervisor</text>
<text x="20.0" y="52.0" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">One approved machine inside the institution holds the finding folder and RegRem Engine.</text>
<text x="20.0" y="68.2" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Where the institution allows an AI assistant, it drafts into the folder. The institution&#x27;s own systems stay as they are.</text>
<text x="20.0" y="84.4" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">RegRem Engine sends nothing out, and the institution sends the closure package by its own channels.</text>
<rect x="20.0" y="98.6" width="775.0" height="522.6" rx="10" fill="#fafafa" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="32.0" y="116.6" font-size="12" font-weight="700" fill="#9a3412" text-anchor="start">Inside the institution</text>
<text x="831.0" y="116.6" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start">Outside the institution</text>
<rect x="32.0" y="132.2" width="152.0" height="455.0" rx="10" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="44.0" y="150.2" font-size="12" font-weight="700" fill="#5b6470" text-anchor="start">The institution&#x27;s</text>
<text x="44.0" y="165.2" font-size="12" font-weight="700" fill="#5b6470" text-anchor="start">own systems</text>
<rect x="210.0" y="132.2" width="404.0" height="455.0" rx="10" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="222.0" y="150.2" font-size="12" font-weight="700" fill="#5b6470" text-anchor="start">One approved machine</text>
<text x="222.0" y="165.2" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">where the folder and the tool live</text>
<rect x="626.0" y="132.2" width="160.0" height="455.0" rx="10" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="638.0" y="150.2" font-size="12" font-weight="700" fill="#5b6470" text-anchor="start">People in the</text>
<text x="638.0" y="165.2" font-size="12" font-weight="700" fill="#5b6470" text-anchor="start">institution</text>
<rect x="40.0" y="182.2" width="136.0" height="80.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="48.0" y="200.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Document store</text>
<text x="48.0" y="219.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">originals stay here</text>
<text x="48.0" y="235.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">and a copy goes</text>
<text x="48.0" y="251.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">into the folder</text>
<rect x="40.0" y="272.2" width="136.0" height="80.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="48.0" y="290.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Email</text>
<text x="48.0" y="309.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">approvals by email</text>
<text x="48.0" y="325.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">are saved into the</text>
<text x="48.0" y="341.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">folder</text>
<rect x="40.0" y="362.2" width="136.0" height="81.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="48.0" y="380.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Internal audit&#x27;s</text>
<text x="48.0" y="397.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">report</text>
<text x="48.0" y="416.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">its reference goes</text>
<text x="48.0" y="432.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">into the record</text>
<rect x="40.0" y="453.2" width="136.0" height="96.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="48.0" y="471.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Board pack</text>
<text x="48.0" y="490.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">the draft summary</text>
<text x="48.0" y="506.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">goes to the board</text>
<text x="48.0" y="522.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">as the owner</text>
<text x="48.0" y="538.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">decides</text>
<rect x="634.0" y="182.2" width="144.0" height="64.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="642.0" y="200.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Business teams</text>
<text x="642.0" y="219.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">do the fix and sign</text>
<text x="642.0" y="235.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">their evidence</text>
<rect x="634.0" y="256.2" width="144.0" height="64.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="642.0" y="274.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Preparer</text>
<text x="642.0" y="293.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">copies files in and</text>
<text x="642.0" y="309.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">runs the check</text>
<rect x="634.0" y="330.2" width="144.0" height="64.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="653.0" cy="343.7" r="11" fill="#9a3412"/>
<text x="653.0" y="348.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="670.0" y="348.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Finding owner</text>
<text x="642.0" y="367.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">rules on each row,</text>
<text x="642.0" y="383.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">then signs</text>
<rect x="634.0" y="404.2" width="144.0" height="64.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="653.0" cy="417.7" r="11" fill="#9a3412"/>
<text x="653.0" y="422.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="670.0" y="422.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Internal audit</text>
<text x="642.0" y="441.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">tests whether the fix</text>
<text x="642.0" y="457.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">works</text>
<rect x="634.0" y="478.2" width="144.0" height="64.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="642.0" y="496.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">Engineer</text>
<text x="642.0" y="515.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">fits the tool to the</text>
<text x="642.0" y="531.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">institution&#x27;s files</text>
<rect x="220.0" y="182.2" width="172.0" height="317.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<circle cx="239.0" cy="195.7" r="11" fill="#9a3412"/>
<text x="239.0" y="200.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="256.0" y="200.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">The finding folder</text>
<text x="228.0" y="218.7" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">one folder for</text>
<text x="228.0" y="234.7" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">each finding</text>
<rect x="230.0" y="254.8" width="152.0" height="26.0" rx="4" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1"/>
<path d="M238.0 262.3 h6.5 l3.5 3.5 v7.5 h-10 z" fill="#ffffff" stroke="#5b6470" stroke-width="1"/>
<path d="M244.5 262.3 v3.5 h3.5" fill="none" stroke="#5b6470" stroke-width="1"/>
<text x="256.0" y="272.3" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">the letter</text>
<rect x="230.0" y="294.8" width="152.0" height="26.0" rx="4" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1"/>
<path d="M238.0 302.3 h6.5 l3.5 3.5 v7.5 h-10 z" fill="#ffffff" stroke="#5b6470" stroke-width="1"/>
<path d="M244.5 302.3 v3.5 h3.5" fill="none" stroke="#5b6470" stroke-width="1"/>
<text x="256.0" y="312.3" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">the plan</text>
<rect x="230.0" y="334.8" width="152.0" height="26.0" rx="4" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1"/>
<path d="M238.0 342.3 h6.5 l3.5 3.5 v7.5 h-10 z" fill="#ffffff" stroke="#5b6470" stroke-width="1"/>
<path d="M244.5 342.3 v3.5 h3.5" fill="none" stroke="#5b6470" stroke-width="1"/>
<text x="256.0" y="352.3" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">evidence copies</text>
<rect x="230.0" y="374.8" width="152.0" height="26.0" rx="4" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1"/>
<path d="M238.0 382.3 h6.5 l3.5 3.5 v7.5 h-10 z" fill="#ffffff" stroke="#5b6470" stroke-width="1"/>
<path d="M244.5 382.3 v3.5 h3.5" fill="none" stroke="#5b6470" stroke-width="1"/>
<text x="256.0" y="392.3" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">the closure memo</text>
<rect x="230.0" y="414.8" width="152.0" height="26.0" rx="4" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1"/>
<path d="M238.0 422.3 h6.5 l3.5 3.5 v7.5 h-10 z" fill="#ffffff" stroke="#5b6470" stroke-width="1"/>
<path d="M244.5 422.3 v3.5 h3.5" fill="none" stroke="#5b6470" stroke-width="1"/>
<text x="256.0" y="432.3" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">the owner&#x27;s rulings</text>
<rect x="230.0" y="454.8" width="152.0" height="26.0" rx="4" fill="#f1f3f5" stroke="#c9cdd3" stroke-width="1"/>
<path d="M238.0 462.3 h6.5 l3.5 3.5 v7.5 h-10 z" fill="#ffffff" stroke="#5b6470" stroke-width="1"/>
<path d="M244.5 462.3 v3.5 h3.5" fill="none" stroke="#5b6470" stroke-width="1"/>
<text x="256.0" y="472.3" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">the sign-off record</text>
<rect x="418.0" y="182.2" width="186.0" height="118.0" rx="6" fill="#ffffff" stroke="#9a3412" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="437.0" cy="195.7" r="11" fill="#9a3412"/>
<text x="437.0" y="200.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="454.0" y="200.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">AI assistant</text>
<text x="426.0" y="219.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">where the institution</text>
<text x="426.0" y="235.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">allows one</text>
<text x="426.0" y="254.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">drafts the plan, the memo</text>
<text x="426.0" y="270.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">and other papers</text>
<text x="426.0" y="289.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">never signs</text>
<rect x="418.0" y="322.2" width="186.0" height="137.0" rx="6" fill="#fdf0e8" stroke="#9a3412" stroke-width="2"/>
<circle cx="437.0" cy="335.7" r="11" fill="#9a3412"/>
<text x="437.0" y="340.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="454.0" y="340.2" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">RegRem Engine</text>
<text x="426.0" y="359.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">ties each figure, date and</text>
<text x="426.0" y="375.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">quotation to its cited page</text>
<text x="426.0" y="394.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">lists what does not match,</text>
<text x="426.0" y="410.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">for the finding owner</text>
<text x="426.0" y="429.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">no AI model inside</text>
<text x="426.0" y="448.2" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">the same answer every run</text>
<text x="220.0" y="524.2" font-size="12.5" font-weight="700" fill="#5b6470" text-anchor="start">RegRem Engine:</text>
<rect x="220.0" y="531.2" width="120.0" height="46.0" rx="6" fill="#ffffff" stroke="#9a3412" stroke-width="1"/>
<text x="280.0" y="550.7" font-size="12" font-weight="700" fill="#1f1e1d" text-anchor="middle">Nothing installed</text>
<text x="280.0" y="566.7" font-size="12" font-weight="700" fill="#1f1e1d" text-anchor="middle">beyond Python</text>
<rect x="352.0" y="531.2" width="120.0" height="46.0" rx="6" fill="#ffffff" stroke="#9a3412" stroke-width="1"/>
<text x="412.0" y="550.7" font-size="12" font-weight="700" fill="#1f1e1d" text-anchor="middle">No network</text>
<text x="412.0" y="566.7" font-size="12" font-weight="700" fill="#1f1e1d" text-anchor="middle">connection</text>
<rect x="484.0" y="531.2" width="120.0" height="46.0" rx="6" fill="#ffffff" stroke="#9a3412" stroke-width="1"/>
<text x="544.0" y="550.7" font-size="12" font-weight="700" fill="#1f1e1d" text-anchor="middle">Reads text, PDF,</text>
<text x="544.0" y="566.7" font-size="12" font-weight="700" fill="#1f1e1d" text-anchor="middle">Word and Excel</text>
<path d="M176.0 212.2 L220.0 212.2" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M176.0 302.2 L220.0 302.2" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M176.0 392.2 L220.0 392.2" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M220.0 483.2 L176.0 483.2" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M418.0 212.2 L392.0 212.2" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M392.0 352.2 L418.0 352.2" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M604.0 362.2 L634.0 362.2" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="848.0" y="190.6" width="132.0" height="147.0" rx="6" fill="#ffffff" stroke="#c9cdd3" stroke-width="1"/>
<text x="856.0" y="208.6" font-size="13.5" font-weight="700" fill="#1f1e1d" text-anchor="start">The Supervisor</text>
<text x="856.0" y="227.6" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">receives the</text>
<text x="856.0" y="243.6" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">closure package,</text>
<text x="856.0" y="259.6" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">sent by the</text>
<text x="856.0" y="275.6" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">institution through</text>
<text x="856.0" y="291.6" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">its own channels</text>
<text x="856.0" y="310.6" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">closes the finding</text>
<text x="856.0" y="326.6" font-size="12.5" font-weight="normal" fill="#1f1e1d" text-anchor="start">or sends it back</text>
<path d="M795.0 160.6 L914.0 160.6 L914.0 190.6" fill="none" stroke="#5b6470" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="815.0" cy="143.6" r="11" fill="#9a3412"/>
<text x="815.0" y="147.9" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="831.0" y="148.1" font-size="12.5" font-weight="700" fill="#5b6470" text-anchor="start">closure package</text>
<text x="32.0" y="608.2" font-size="12.5" font-weight="700" fill="#9a3412" text-anchor="start">RegRem Engine sends nothing anywhere. The institution sends the closure package itself.</text>
<text x="20.0" y="645.2" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Shaded: RegRem Engine. Dashed box: the AI assistant, which drafts and never signs.</text>
<text x="20.0" y="660.7" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">Arrows: files moving. Numbers: the order of the work. The check ties each figure, date</text>
<text x="20.0" y="676.2" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">and quotation to the evidence page it cites. It does not judge whether the fix works,</text>
<text x="20.0" y="691.7" font-size="12.5" font-weight="normal" fill="#5b6470" text-anchor="start">and a person still reads each sentence against its page. Every case here is invented.</text></svg>
